<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 40px;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f3ef; color: #1f1f1d;
  }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .header p { font-size: 13px; color: #6b6a65; margin: 4px 0 0; }
  .badge {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fbeae7; display:flex; align-items:center; justify-content:center;
    font-size: 18px; flex-shrink: 0;
  }
  .banner {
    background: #fbeae7; color: #712b13; border-radius: 10px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 16px;
  }
  .card {
    background: #ffffff; border: 1px solid #e4e2d9; border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .card.extra {
    background: #fff8e6; border-color: #f0d38a;
  }
  .card.diesel {
    background: #f0fdf4; border-color: #bbf7d0;
  }
  .card-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: transparent; border: none; text-align: left;
    cursor: pointer; font: inherit; color: inherit;
  }
  .num {
    width: 32px; height: 32px; border-radius: 50%; background: #e6f1fb;
    color: #0c447c; display:flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .num.warn { background: #fbeae7; color: #b3401f; font-size: 16px; }
  .num.diesel-icon { background: #dcfce7; color: #166534; font-size: 16px; }
  
  .head-text { flex: 1; min-width: 0; }
  .title { font-size: 14px; font-weight: 600; margin: 0; }
  .subtitle {
    font-size: 12px; color: #6b6a65; margin: 2px 0 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chev { font-size: 14px; color: #9a988f; transition: transform 0.2s; flex-shrink: 0; }
  .card-body { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
  .card-body-inner {
    padding: 0 14px 14px 56px; font-size: 13px; line-height: 1.6;
    border-top: 1px solid #eeece4; padding-top: 10px; margin-top: 2px;
  }
  .card.extra .card-body-inner { border-top-color: #f0d38a; }
  .card.diesel .card-body-inner { border-top-color: #bbf7d0; }
  
  .card.open .chev { transform: rotate(180deg); }
  .status { font-size: 13px; color: #6b6a65; padding: 20px 0; text-align: center; }

  .section { margin-bottom: 10px; }
  .section:last-child { margin-bottom: 0; }
  .section-label {
    font-size: 12px; font-weight: 700; margin: 0 0 4px; color: #1f1f1d;
  }
  .section-body { font-size: 13px; line-height: 1.6; }

  .stamp {
    font-size: 12px; color: #166534; font-weight: 600;
    margin: 0 0 10px; padding: 6px 10px;
    background: #dcfce7; border-radius: 8px; display: inline-block;
  }
</style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Инструкция по заправкам</h1>
      <p id="dateLine">Цены обновлены: …</p>
    </div>
    <div class="badge">&#9888;</div>
  </div>

  <div class="banner">Внимание, в инструкции есть изменения. Выберите нужный блок ниже.</div>

  <div id="acc"><div class="status">Загрузка…</div></div>

<script>
const META_CSV_URL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIb_CZuKwVFJfrY9KMPb24idCfhUq5eLq4E8prXR_-wOQTvz93aAxraiS-ZcEWmEGi3RFAibQtOSNO/pub?gid=1707662453&single=true&output=csv';
const BLOCKS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIb_CZuKwVFJfrY9KMPb24idCfhUq5eLq4E8prXR_-wOQTvz93aAxraiS-ZcEWmEGi3RFAibQtOSNO/pub?gid=772559255&single=true&output=csv';

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c !== ''));
}

function linesToList(str, isNumbered = false) {
  const lines = String(str).split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length === 0) return '';

  if (isNumbered) {
    const firstLine = escapeHtml(lines[0]);
    const restLines = lines.slice(1);
    
    let html = `<p style="margin: 0 0 12px 0;"><strong>${firstLine}</strong></p>`;
    
    if (restLines.length > 0) {
      html += '<ol style="margin: 0; padding-left: 24px; list-style-type: decimal;">' 
           + restLines.map(s => `<li>${escapeHtml(s)}</li>`).join('') 
           + '</ol>';
    }
    return html;
  } else {
    return '<ul style="margin: 0; padding-left: 16px; list-style-type: disc;">' 
         + lines.map(s => `<li>${escapeHtml(s)}</li>`).join('') 
         + '</ul>';
  }
}

function buildSection(label, content, isNumbered = false) {
  if (!content || !content.trim()) return '';
  const labelHtml = label ? `<p class="section-label">${label}</p>` : '';
  return `
    <div class="section">
      ${labelHtml}
      <div class="section-body">${linesToList(content, isNumbered)}</div>
    </div>`;
}

function buildBlockEl(n, title, subtitle, main, reserve, rules, cardType, stamp = '') {
  const item = document.createElement('div');
  
  if (cardType === 'extra') {
    item.className = 'card extra';
  } else if (cardType === 'diesel') {
    item.className = 'card diesel';
  } else {
    item.className = 'card';
  }

  let numHtml = `<div class="num">${n}</div>`;
  if (cardType === 'extra') {
    numHtml = `<div class="num warn">&#9888;</div>`;
  } else if (cardType === 'diesel') {
    numHtml = `<div class="num diesel-icon">⛽</div>`;
  }

  const btn = document.createElement('button');
  btn.className = 'card-head';
  btn.innerHTML = `
    ${numHtml}
    <div class="head-text">
      <p class="title">${escapeHtml(title)}</p>
      <p class="subtitle">${escapeHtml(subtitle)}</p>
    </div>
    <div class="chev">&#9662;</div>`;

  const bodyEl = document.createElement('div');
  bodyEl.className = 'card-body';

  let inner = '';
  if (cardType === 'diesel') {
    const stampHtml = stamp ? `<p class="stamp">Актуально на: ${escapeHtml(stamp)}</p>` : '';
    inner = stampHtml + buildSection('', rules, true);
  } else if (cardType === 'extra') {
    inner = buildSection('', rules, false);
  } else {
    inner = buildSection('Основная:', main, false) +
            buildSection('Резервная:', reserve, false) +
            buildSection('Доп. правила:', rules, false);
  }

  bodyEl.innerHTML = `<div class="card-body-inner">${inner}</div>`;

  btn.onclick = () => {
    const isOpen = item.classList.contains('open');
    
    document.querySelectorAll('.card').forEach(c => {
      c.classList.remove('open');
      c.querySelector('.card-body').style.maxHeight = '0px';
    });
    
    if (!isOpen) {
      item.classList.add('open');
      const innerContainer = bodyEl.querySelector('.card-body-inner');
      bodyEl.style.maxHeight = innerContainer.scrollHeight + 15 + 'px';
    }
  };

  item.appendChild(btn);
  item.appendChild(bodyEl);
  return item;
}

async function load() {
  try {
    const [metaText, blocksText] = await Promise.all([
      fetch(META_CSV_URL, {cache:'no-store'}).then(r => r.text()),
      fetch(BLOCKS_CSV_URL, {cache:'no-store'}).then(r => r.text())
    ]);

    const metaRows = parseCsv(metaText);
    const date = metaRows[0] ? metaRows[0][1] : '';
    
    let extraRules = metaRows[1] ? metaRows[1][1] : '';
    if (!extraRules || extraRules.trim() === '') {
      extraRules = 'Дополнительные правила отсутствуют.';
    }

    let dieselPrices = metaRows[2] ? metaRows[2][1] : '';
    if (!dieselPrices || dieselPrices.trim() === '') {
      dieselPrices = 'Цены пока не загружены.';
    }

    document.getElementById('dateLine').textContent = 'Цены обновлены: ' + date;

    const acc = document.getElementById('acc');
    acc.innerHTML = '';

    acc.appendChild(buildBlockEl(null, 'Дополнительные правила', 'Нажмите, чтобы посмотреть', '', '', extraRules, 'extra'));
    acc.appendChild(buildBlockEl(null, 'Самые Выгодные цены на DIESEL', 'Нажмите, чтобы посмотреть', '', '', dieselPrices, 'diesel', date));

    const blockRows = parseCsv(blocksText);
    blockRows.shift();
    
    blockRows.forEach((r, i) => {
      if (!r[0]) return;
      acc.appendChild(buildBlockEl(i + 1, r[0], r[1], r[2], r[3], r[4], 'normal'));
    });

  } catch (e) {
    document.getElementById('acc').innerHTML =
      '<div class="status">Не удалось загрузить инструкцию. Проверьте интернет и обновите страницу.</div>';
    console.error(e);
  }
}
load();
</script>
</body>
</html>
