<script>
const META_CSV_URL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIb_CZuKwVFJfrY9KMPb24idCfhUq5eLq4E8prXR_-wOQTvz93aAxraiS-ZcEWmEGi3RFAibQtOSNO/pub?gid=1707662453&single=true&output=csv';
const BLOCKS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIb_CZuKwVFJfrY9KMPb24idCfhUq5eLq4E8prXR_-wOQTvz93aAxraiS-ZcEWmEGi3RFAibQtOSNO/pub?gid=772559255&single=true&output=csv';

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c !== ''));
}

// Превращает "голые" ссылки http(s) в тексте блока (из Google Таблицы) в кликабельные
// <a target="_blank">, чтобы водитель мог открыть их в новой вкладке. Работает поверх
// уже экранированного HTML (escapeHtml сначала) — экранирование URL с "&" безопасно,
// браузер сам раскодирует &amp; в href.
function linkifyEscaped(escapedStr) {
  return escapedStr.replace(/https?:\/\/[^\s<]+/g, (url) => {
    let trail = '';
    const m = url.match(/[).,;:!?]+$/);
    if (m) { trail = m[0]; url = url.slice(0, -trail.length); }
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trail}`;
  });
}

// Строка, начинающаяся с одного из этих символов, становится жирным подзаголовком
// без точки-маркера (символ убирается) — способ отметить "новая тема" внутри ячейки
// без пустой строки. Пустая строка тоже разрывает абзац (см. buildSegments).
// Разных значков специально несколько: владелец таблицы может использовать любой
// на свой вкус в разных местах — все они работают одинаково.
const HEADING_MARKERS = ['#', '>', '~', '*', '★', '✦', '▶', '➤', '📌', '‣'];

function stripHeadingMarker(line) {
  for (const m of HEADING_MARKERS) {
    if (line.startsWith(m)) return line.slice(m.length).trim();
  }
  return null;
}

// Разбивает текст ячейки на сегменты: списки (ul/ol) и жирные подзаголовки.
// Пустая строка или строка-маркер разрывают текущий список.
function buildSegments(lines) {
  const segments = [];
  let buffer = [];
  const flush = () => {
    if (buffer.length) { segments.push({ type: 'list', items: buffer }); buffer = []; }
  };
  for (const raw of lines) {
    if (raw === '') { flush(); continue; }
    const heading = stripHeadingMarker(raw);
    if (heading !== null) {
      flush();
      if (heading) segments.push({ type: 'heading', text: heading });
    } else {
      buffer.push(raw);
    }
  }
  flush();
  return segments;
}

function renderSegments(segments, listTag) {
  const padding = listTag === 'ol' ? 24 : 16;
  const listStyle = listTag === 'ol' ? 'decimal' : 'none';
  return segments.map((seg, i) => {
    const spaced = i > 0;
    if (seg.type === 'heading') {
      return `<p style="margin: ${spaced ? 14 : 0}px 0 4px 0; font-weight: 700;">`
           + linkifyEscaped(escapeHtml(seg.text)) + '</p>';
    }
    return `<${listTag} style="margin: ${spaced ? 10 : 0}px 0 0 0; padding-left: ${padding}px; list-style-type: ${listStyle};">`
         + seg.items.map(s => `<li>${linkifyEscaped(escapeHtml(s))}</li>`).join('')
         + `</${listTag}>`;
  }).join('');
}

function linesToList(str, isNumbered = false) {
  let lines = String(str).split('\n').map(s => s.trim());

  let titleHtml = '';
  if (isNumbered) {
    const firstIdx = lines.findIndex(l => l !== '');
    if (firstIdx === -1) return '';
    const firstLine = stripHeadingMarker(lines[firstIdx]) ?? lines[firstIdx];
    titleHtml = `<p style="margin: 0 0 12px 0;"><strong>${linkifyEscaped(escapeHtml(firstLine))}</strong></p>`;
    lines = lines.slice(firstIdx + 1);
  }

  const segments = buildSegments(lines);
  if (segments.length === 0) return titleHtml;
  return titleHtml + renderSegments(segments, isNumbered ? 'ol' : 'ul');
}

function buildSection(label, content, isNumbered = false) {
  if (!content || !content.trim()) return '';
  const labelHtml = label ? `<p class="section-label">${label}</p>` : '';
  return `
    <div class="section">
      ${labelHtml}
      <div class="section-body">${linesToList(content, isNumbered)}</div>
    </div>`;
}

// Каждая строка списка цен склеена в таблице формулой в виде
// "Страна  /  Станция   -   Карта" (2+ пробела вокруг "/" и "-" —
// это и есть разделитель; внутри названий станций попадаются свои
// одиночные дефисы вроде "Vitoria-Gasteiz", но там пробелов вокруг
// дефиса меньше двух, поэтому regex их не путает с разделителем).
function parsePriceLine(line) {
  const m = line.match(/^(.*?)\s{2,}\/\s{2,}(.*)\s{2,}-\s{2,}(.*)$/);
  if (!m) return null;
  return [m[1].trim(), m[2].trim(), m[3].trim()];
}

function buildPriceTable(content) {
  const lines = String(content).split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length === 0) return '';

  const header = parsePriceLine(lines[0]);
  if (!header || lines.length === 1) {
    // Нет данных (например "Цены пока не загружены.") или формат не совпал.
    return `<p style="margin:0;"><strong>${escapeHtml(lines[0])}</strong></p>`;
  }

  const rows = lines.slice(1).map((line, i) => {
    const parts = parsePriceLine(line);
    if (!parts) return `<tr><td colspan="4">${escapeHtml(line)}</td></tr>`;
    const [country, station, card] = parts;
    return `<tr><td class="pt-n">${i + 1}</td><td>${escapeHtml(country)}</td>`
         + `<td>${escapeHtml(station)}</td><td>${escapeHtml(card)}</td></tr>`;
  }).join('');

  return `
    <div class="price-table-wrap">
      <table class="price-table">
        <thead><tr><th></th><th>${escapeHtml(header[0])}</th><th>${escapeHtml(header[1])}</th><th>${escapeHtml(header[2])}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function buildDividerEl(label, groupClass) {
  const div = document.createElement('div');
  div.className = 'group-divider' + (groupClass ? ' ' + groupClass : '');
  div.textContent = label;
  return div;
}

function buildBlockEl(n, title, subtitle, main, reserve, rules, cardType, stamp = '', groupClass = '') {
  const item = document.createElement('div');

  if (cardType === 'extra') {
    item.className = 'card extra';
  } else if (cardType === 'diesel') {
    item.className = 'card diesel';
  } else if (cardType === 'adblue') {
    item.className = 'card adblue';
  } else {
    item.className = 'card' + (groupClass ? ' ' + groupClass : '');
  }

  let numHtml = `<div class="num${groupClass ? ' ' + groupClass : ''}">${n}</div>`;
  if (cardType === 'extra') {
    numHtml = `<div class="num warn"><img src="pravila_icon.png" alt=""></div>`;
  } else if (cardType === 'diesel') {
    numHtml = `<div class="num diesel-icon"><img src="diesel_icon.png" alt=""></div>`;
  } else if (cardType === 'adblue') {
    numHtml = `<div class="num adblue-icon"><img src="adblue_icon.png" alt=""></div>`;
  }

  const btn = document.createElement('button');
  btn.className = 'card-head';
  btn.innerHTML = `
    ${numHtml}
    <div class="head-text">
      <p class="title">${escapeHtml(title)}</p>
      <p class="subtitle">${escapeHtml(subtitle)}</p>
    </div>
    <div class="chev">&#9662;</div>`;

  const bodyEl = document.createElement('div');
  bodyEl.className = 'card-body';

  let inner = '';
  let innerClass = 'card-body-inner';
  if (cardType === 'diesel' || cardType === 'adblue') {
    const stampClass = cardType === 'adblue' ? 'stamp adblue' : 'stamp';
    const stampHtml = stamp ? `<p class="${stampClass}">Актуально на: ${escapeHtml(stamp)}</p>` : '';
    inner = stampHtml + buildPriceTable(rules);
    innerClass += ' price-mode';
  } else if (cardType === 'extra') {
    inner = buildSection('', rules, false);
  } else {
    inner = buildSection('Основная:', main, false) +
            buildSection('Резервная:', reserve, false) +
            buildSection('Доп. правила:', rules, false);
  }

  bodyEl.innerHTML = `<div class="${innerClass}">${inner}</div>`;

  btn.onclick = () => {
    const isOpen = item.classList.contains('open');
    
    document.querySelectorAll('.card').forEach(c => {
      c.classList.remove('open');
      c.querySelector('.card-body').style.maxHeight = '0px';
    });
    
    if (!isOpen) {
      item.classList.add('open');
      const innerContainer = bodyEl.querySelector('.card-body-inner');
      bodyEl.style.maxHeight = innerContainer.scrollHeight + 15 + 'px';
    }
  };

  item.appendChild(btn);
  item.appendChild(bodyEl);
  return item;
}

async function load() {
  try {
    const [metaText, blocksText] = await Promise.all([
      fetch(META_CSV_URL, {cache:'no-store'}).then(r => r.text()),
      fetch(BLOCKS_CSV_URL, {cache:'no-store'}).then(r => r.text())
    ]);

    const metaRows = parseCsv(metaText);
    const date = metaRows[0] ? metaRows[0][1] : '';
    
    let extraRules = metaRows[1] ? metaRows[1][1] : '';
    if (!extraRules || extraRules.trim() === '') {
      extraRules = 'Дополнительные правила отсутствуют.';
    }

    let dieselPrices = metaRows[2] ? metaRows[2][1] : '';
    if (!dieselPrices || dieselPrices.trim() === '') {
      dieselPrices = 'Цены пока не загружены.';
    }

    let adbluePrices = metaRows[3] ? metaRows[3][1] : '';
    if (!adbluePrices || adbluePrices.trim() === '') {
      adbluePrices = 'Цены пока не загружены.';
    }

    document.getElementById('dateLine').textContent = 'Цены обновлены: ' + date;

    const acc = document.getElementById('acc');
    acc.innerHTML = '';

    acc.appendChild(buildBlockEl(null, 'Дополнительные правила', 'Нажмите, чтобы посмотреть', '', '', extraRules, 'extra'));
    acc.appendChild(buildBlockEl(null, 'Самые Выгодные цены на DIESEL', 'Нажмите, чтобы посмотреть', '', '', dieselPrices, 'diesel', date));
    acc.appendChild(buildBlockEl(null, 'Самые Выгодные цены на ADBLUE', 'Нажмите, чтобы посмотреть', '', '', adbluePrices, 'adblue', date));

    const blockRows = parseCsv(blocksText);
    blockRows.shift();

    const GROUP_CLASS = {
      'Работа по БАЛТИИ': 'group-baltics',
      'Работа в Европе': 'group-europe',
      'AdBlue': 'group-adblue',
    };

    let lastGroup = '';
    blockRows.forEach((r, i) => {
      if (!r[0]) return;
      const group = (r[5] || '').trim();
      const groupClass = GROUP_CLASS[group] || '';
      if (group && group !== lastGroup) {
        acc.appendChild(buildDividerEl(group, groupClass));
      }
      lastGroup = group;
      acc.appendChild(buildBlockEl(i + 1, r[0], r[1], r[2], r[3], r[4], 'normal', '', groupClass));
    });

  } catch (e) {
    document.getElementById('acc').innerHTML =
      '<div class="status">Не удалось загрузить инструкцию. Проверьте интернет и обновите страницу.</div>';
    console.error(e);
  }
}
load();
</script>
</body>
</html>
